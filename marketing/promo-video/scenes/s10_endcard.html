<!doctype html>
<html><head><meta charset="utf-8"><title>Scene 10 — End card</title>
<link rel="stylesheet" href="../shared.css">
<script src="../config.js"></script><script src="../shared.js"></script>
<style>
  .c { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; }
  .brand { display: flex; align-items: center; gap: 30px; animation: fadeUp .8s .3s both; }
  .brand .logo { font-size: 110px; }
  .brand .name { font: 700 104px/1 "Poppins"; }
  .tag { font: 600 64px/1.2 "Poppins"; margin-top: 60px; animation: fadeUp .8s 1.0s both; }
  .sub { font-size: 36px; color: #b9c1cf; margin-top: 18px; animation: fadeUp .8s 1.6s both; }
  .chips { display: flex; gap: 18px; margin-top: 70px; }
  .chips span { font-size: 28px; padding: 14px 28px; border-radius: 40px; border: 1px solid #2f3a52;
                background: rgba(29,123,255,.08); color: #dbe3f1; animation: fadeUp .6s both; }
  .cta { margin-top: 80px; display: flex; gap: 34px; align-items: center; animation: fadeUp .8s 3.6s both; }
  .btn { font: 600 36px "Poppins"; padding: 22px 52px; border-radius: 16px;
         background: linear-gradient(180deg, var(--blue-hi), var(--blue)); box-shadow: 0 14px 40px rgba(29,123,255,.4); }
  .mail { font-size: 34px; color: #b9c1cf; }
</style></head>
<body>
<div class="glow"></div>
<div class="c">
  <div class="brand"><span class="logo"></span><span class="name" data-p="product"></span></div>
  <div class="tag" data-p="tagline"></div>
  <div class="sub">So your engineers can get back to engineering.</div>
  <div class="chips">
    <span style="animation-delay:2.2s">SWE.3 Detailed Design</span>
    <span style="animation-delay:2.4s">SWE.4 Unit Test Specification</span>
    <span style="animation-delay:2.6s">Review &amp; approval</span>
    <span style="animation-delay:2.8s">Incremental releases</span>
  </div>
  <div class="cta"><span class="btn">Book a demo</span><span class="mail" data-p="contact"></span></div>
</div>
</body></html>
